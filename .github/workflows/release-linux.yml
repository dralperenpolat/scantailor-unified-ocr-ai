name: Upload verified 0.6.4 packages
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: '423455847'
    steps:
      - name: Verify build provenance and unpublished release
        shell: bash
        run: |
          set -euo pipefail
          gh run watch 40203011297 --interval 20 --exit-status --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40203011297" > windows-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/40201253449" > linux-run.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-before.json
          python3 - <<'PY'
          import json
          expected={'windows':'2684e537e6e28eaa65e3e06ed91a62cb6bac764c','linux':'b9beb6f61348e40ea01a2f4c14b1ef20eab59dd6'}
          for platform,sha in expected.items():
              run=json.load(open(platform+'-run.json'))
              assert run['conclusion']=='success' and run['head_sha']==sha
          release=json.load(open('release-before.json'))
          assert release['draft'] and release['tag_name']=='v0.6.4'
          assert release['target_commitish']==expected['windows']
          assert not release['assets'], 'Refusing to overwrite existing release files'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-0.6.4-full
          path: packages/windows
          run-id: '40203011297'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-0.6.4-full
          path: packages/linux
          run-id: '40201253449'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package records and upload the two full packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir proof
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          linux=json.loads(Path('packages/linux/linux-acceptance-0.6.4.json').read_text())
          assert linux['version']=='0.6.4' and linux['source_commit']=='b9beb6f61348e40ea01a2f4c14b1ef20eab59dd6'
          assert linux['native_ui']=='passed' and linux['manifest_files_verified']>30000
          for platform in ('windows','linux'):
              install=json.loads(Path('packages',platform,'install-result.json').read_text())
              assert all(install[key] for key in ('install','uninstall','user_project_preserved'))
              assert install['manifest_files_verified']>30000
          records=[]
          for path in (Path('packages/windows/scantailor-ocr-unified-0.6.4-windows-x64-full-setup.exe'),Path('packages/linux/scantailor-ocr-unified-0.6.4-linux-x64-full.tar.gz')):
              hasher=hashlib.sha256()
              with path.open('rb') as stream:
                  for chunk in iter(lambda:stream.read(8*1024*1024),b''):hasher.update(chunk)
              sha=hasher.hexdigest()
              records.append({'name':path.name,'size':path.stat().st_size,'digest':'sha256:'+sha})
          Path('proof/package-digests.json').write_text(json.dumps(records,indent=2))
          PY
          gh release upload v0.6.4 packages/windows/scantailor-ocr-unified-0.6.4-windows-x64-full-setup.exe --repo "$GITHUB_REPOSITORY"
          gh release upload v0.6.4 packages/linux/scantailor-ocr-unified-0.6.4-linux-x64-full.tar.gz --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > proof/release-uploaded.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('proof/release-uploaded.json').read_text())
          expected=json.loads(Path('proof/package-digests.json').read_text())
          assets={asset['name']:asset for asset in release['assets']}
          assert release['draft'] and release['tag_name']=='v0.6.4'
          assert set(assets)=={item['name'] for item in expected}
          for item in expected:
              assert all(assets[item['name']][key]==item[key] for key in ('name','size','digest'))
          print(json.dumps({'verified_assets':expected,'release_id':release['id']},indent=2))
          PY
          cp packages/linux/linux-acceptance-0.6.4.json proof/
          cp packages/windows/install-result.json proof/windows-install-result.json
          cp packages/linux/install-result.json proof/linux-install-result.json
          cp packages/linux/final-1.png packages/linux/final-2.png packages/linux/pdf-import-tr.png proof/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-0.6.4
          path: proof/
          retention-days: 3
