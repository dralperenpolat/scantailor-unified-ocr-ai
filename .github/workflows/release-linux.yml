name: Upload verified 0.6.2 packages
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  upload:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_ID: '420461946'
    steps:
      - name: Verify build provenance and unpublished release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39745460417" > windows-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/39748027548" > linux-run.json
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release-before.json
          python3 - <<'PY'
          import json
          expected={'windows':'c01e4578c678574b96dbc4ab2ca9439c3ff748db','linux':'5335423163c258e345316145f342d9df77dceaf1'}
          for platform,sha in expected.items():
              run=json.load(open(platform+'-run.json'))
              assert run['conclusion']=='success' and run['head_sha']==sha
          release=json.load(open('release-before.json'))
          assert release['draft'] and release['tag_name']=='v0.6.2'
          assert release['target_commitish']==expected['linux']
          assert not release['assets'], 'Refusing to overwrite existing release files'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-0.6.2-full
          path: packages/windows
          run-id: '39745460417'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: release-linux-0.6.2-full
          path: packages/linux
          run-id: '39748027548'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package records and upload the two full packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir proof
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          linux=json.loads(Path('packages/linux/linux-acceptance-0.6.2.json').read_text())
          assert linux['version']=='0.6.2' and linux['source_commit']=='5335423163c258e345316145f342d9df77dceaf1'
          assert linux['native_ui']=='passed' and linux['manifest_files_verified']>30000
          for platform in ('windows','linux'):
              install=json.loads(Path('packages',platform,'install-result.json').read_text())
              assert all(install[key] for key in ('install','uninstall','user_project_preserved'))
              assert install['manifest_files_verified']>30000
          records=[]
          for path in (Path('packages/windows/scantailor-ocr-unified-0.6.2-windows-x64-full-setup.exe'),Path('packages/linux/scantailor-ocr-unified-0.6.2-linux-x64-full.tar.gz')):
              with path.open('rb') as stream:sha=hashlib.file_digest(stream,'sha256').hexdigest()
              records.append({'name':path.name,'size':path.stat().st_size,'digest':'sha256:'+sha})
          Path('proof/package-digests.json').write_text(json.dumps(records,indent=2))
          PY
          gh release upload v0.6.2 packages/windows/scantailor-ocr-unified-0.6.2-windows-x64-full-setup.exe --repo "$GITHUB_REPOSITORY"
          gh release upload v0.6.2 packages/linux/scantailor-ocr-unified-0.6.2-linux-x64-full.tar.gz --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > proof/release-uploaded.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path('proof/release-uploaded.json').read_text())
          expected=json.loads(Path('proof/package-digests.json').read_text())
          assets={asset['name']:asset for asset in release['assets']}
          assert release['draft'] and release['tag_name']=='v0.6.2'
          assert set(assets)=={item['name'] for item in expected}
          for item in expected:
              assert all(assets[item['name']][key]==item[key] for key in ('name','size','digest'))
          print(json.dumps({'verified_assets':expected,'release_id':release['id']},indent=2))
          PY
          cp packages/linux/linux-acceptance-0.6.2.json proof/
          cp packages/windows/install-result.json proof/windows-install-result.json
          cp packages/linux/install-result.json proof/linux-install-result.json
          cp packages/linux/final-1.png packages/linux/final-2.png packages/linux/pdf-import-tr.png proof/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-publication-0.6.2
          path: proof/
          retention-days: 3
