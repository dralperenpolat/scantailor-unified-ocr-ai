name: Restore verified Linux package
on:
  push:
    branches: [release/restore-linux-20261017]
permissions:
  contents: write
  actions: read
concurrency:
  group: restore-linux-050
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5
      - name: Verify and restore the original Linux full package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python packaging/restore_linux_ci.py
