[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scantailor-ocr-unified"
version = "0.6.4"
description = "Local book-photo correction and searchable PDF desktop preview"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = ["Pillow==12.2.0", "PyMuPDF==1.28.0", "pypdf==6.13.3", "pikepdf==10.17.0", "img2pdf==0.6.2", "numpy==2.2.6", "opencv-contrib-python==4.10.0.84", "psutil==7.2.2"]

[project.optional-dependencies]
desktop = ["numpy>=1.26,<2.4", "opencv-contrib-python>=4.8", "torch>=2.6"]

[project.scripts]
scantailor-ocr-unified = "scantailor_ocr_unified.cli:main"
scantailor-ocr-unified-gui = "scantailor_ocr_unified.native_launcher:main"

[tool.setuptools.packages.find]
where = ["src"]
